<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#080D17"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#14B8A6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080D17" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Primary Stroke Gradient -->
    <linearGradient id="neonPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="30%" stop-color="#00F5FF"/>
      <stop offset="70%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Secondary Neon Gradient -->
    <linearGradient id="neonSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Center Reactor Gradient -->
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#A5F3FC"/>
      <stop offset="65%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Glow Filter -->
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- 2. Ambient Core Glow -->
  <circle cx="256" cy="256" r="175" fill="url(#ambientGlow)"/>

  <!-- 3. Isometric Cube 3D Facets (Subtle Lighting) -->
  <!-- Top Face -->
  <path d="M256 76L411.9 166L256 256L100.1 166Z" fill="#00F5FF" fill-opacity="0.08"/>
  <!-- Left Face -->
  <path d="M100.1 166L256 256L256 436L100.1 346Z" fill="#14B8A6" fill-opacity="0.12"/>
  <!-- Right Face -->
  <path d="M256 256L411.9 166L411.9 346L256 436Z" fill="#10B981" fill-opacity="0.18"/>

  <!-- 4. Blueprint Circular Guides & Dashed Lines -->
  <g stroke="#00F5FF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.4">
    <circle cx="256" cy="256" r="146" fill="none"/>
    <circle cx="256" cy="256" r="112" fill="none"/>
    <circle cx="256" cy="256" r="78" fill="none"/>
    <circle cx="256" cy="256" r="44" fill="none"/>
    <!-- Diagonal cross spokes -->
    <line x1="256" y1="256" x2="256" y2="436"/>
    <line x1="256" y1="256" x2="100.1" y2="166"/>
    <line x1="256" y1="256" x2="411.9" y2="166"/>
  </g>

  <!-- 5. Concentric Isometric Hexagons -->
  <!-- Layer 1: Outer Hexagon (Major) -->
  <g filter="url(#cubeGlow)">
    <path d="M256 76L411.9 166V346L256 436L100.1 346V166L256 76Z" 
          stroke="url(#neonPrimary)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Primary 3D Axes (Top, Bottom-Left, Bottom-Right) -->
    <line x1="256" y1="256" x2="256" y2="76" stroke="url(#neonPrimary)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="100.1" y2="346" stroke="url(#neonPrimary)" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="411.9" y2="346" stroke="url(#neonPrimary)" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- Layer 2: Intermediate Hexagon -->
  <path d="M256 110L382.4 183V329L256 402L129.6 329V183L256 110Z" 
        stroke="url(#neonSecondary)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- Layer 3: Middle Hexagon -->
  <path d="M256 144L353 200V312L256 368L159 312V200L256 144Z" 
        stroke="url(#neonPrimary)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- Layer 4: Inner Hexagon -->
  <path d="M256 178L323.5 217V295L256 334L188.5 295V217L256 178Z" 
        stroke="url(#neonSecondary)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Layer 5: Core Hexagon -->
  <path d="M256 212L294.1 234V278L256 300L217.9 278V234L256 212Z" 
        stroke="#67E8F9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 6. Central Glowing Reactor -->
  <circle cx="256" cy="256" r="26" fill="url(#reactorCore)"/>
  <circle cx="256" cy="256" r="28" stroke="#00F5FF" stroke-width="1.8" opacity="0.9"/>
  <circle cx="256" cy="256" r="9" fill="#FFFFFF"/>

  <!-- 7. Node Vertices (Outer Illuminated Points) -->
  <circle cx="256" cy="76" r="5" fill="#67E8F9"/>
  <circle cx="411.9" cy="166" r="5" fill="#00F5FF"/>
  <circle cx="411.9" cy="346" r="5" fill="#14B8A6"/>
  <circle cx="256" cy="436" r="5" fill="#10B981"/>
  <circle cx="100.1" cy="346" r="5" fill="#14B8A6"/>
  <circle cx="100.1" cy="166" r="5" fill="#00F5FF"/>
</svg>