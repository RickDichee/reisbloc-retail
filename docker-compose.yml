# 🐳 REISBLOC POS - Enterprise Composition
version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.staging
    command: npm run dev:staging -- --host
    environment:
      - CHOKIDAR_USEPOLLING=true # Useful for file watching in some Docker setups
    restart: unless-stopped
    networks:
      - reisbloc-network

networks:
  reisbloc-network:
    driver: bridge
