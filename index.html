<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="description" content="Moda Miel MX · Reisbloc Store: Sistema de Punto de Venta (POS), facturación y control de inventario para tiendas de ropa y retail." />
    <link rel="canonical" href="https://reisbloc.com/" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moda Miel MX · Reisbloc Store" />
    <meta property="og:description" content="Sistema de Punto de Venta (POS), facturación y control de inventario para tiendas de ropa y retail." />
    <meta property="og:image" content="/icon.svg" />

    <meta name="apple-mobile-web-app-capable" content="true" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moda Miel MX" />
    <title>Moda Miel MX · Reisbloc Store</title>
    <script>
      // 🛡️ Auto-recuperación de caché: si un asset /assets/ falla por nueva versión o MIME type erróneo, purgar y recargar
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) {
          var url = target.src || target.href || '';
          if (url.indexOf('/assets/') !== -1) {
            console.warn('⚠️ Asset desactualizado detectado:', url);
            if ('caches' in window && !sessionStorage.getItem('pwa_cache_purged')) {
              sessionStorage.setItem('pwa_cache_purged', '1');
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).then(function() {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  }).then(function() {
                    window.location.reload(true);
                  });
                } else {
                  window.location.reload(true);
                }
              });
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
