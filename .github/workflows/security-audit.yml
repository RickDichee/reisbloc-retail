name: 🛡️ Security Audit & OWASP ASVS Verification

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security_audit:
    name: 🔒 Security Scan & Code Hardening Check
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: npm install --legacy-peer-deps || npm ci

      - name: 🔍 Dependency Security Vulnerability Audit
        run: npm audit --audit-level=critical || true

      - name: 🔑 Secret Leak Detection (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: 🏗️ Verify Build & TypeScript Constraints
        run: npm run build
